spring.application.name=ApiRest

# Configuración de base de datos (con tus variables de entorno y valores por defecto)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cuci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Configuración del servidor
server.port=${SERVER_PORT:8083}
# Dirección IP de escucha (0.0.0.0 es indispensable para la red interna de Docker en AWS Lightsail)
server.address=${SERVER_ADDRESS:0.0.0.0}
# --- CONFIGURACIÓN CLAVE PARA FLYWAY ---
# 1. Indicamos a Hibernate que ya no cree ni modifique tablas (usamos validate para seguridad)

# Configuración formal de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# LA CLAVE: Forzar a que el DataSource espere a que Flyway termine de migrar
# spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configuración de Elasticsearch (Con variable de entorno y valor por defecto)
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
