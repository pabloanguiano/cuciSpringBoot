name: Deploy to Amazon ECR and App Runner

on:
  push:
    branches:
      - main # Cambia esto si tu rama principal se llama master o de otra forma

env:
  AWS_REGION: us-east-2                   # La región de AWS donde está tu ECR y App Runner
  ECR_REPOSITORY: springboot-backend   # El NOMBRE exacto de tu repositorio en ECR

jobs:
  deploy:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest # Debe coincidir con el tag que configuraste en Terraform
        run: |
          # Construye la imagen de Docker
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          
          # Sube la imagen al repositorio privado de AWS ECR
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
